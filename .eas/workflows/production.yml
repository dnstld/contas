name: Production Build

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  build_ios:
    name: Build iOS
    type: build
    params:
      platform: ios
      profile: production

  submit_testflight:
    name: Submit to TestFlight
    type: submit
    needs: [build_ios]
    env:
      EXPO_DEBUG: "1"
    params:
      profile: production
      build_id: ${{ needs.build_ios.outputs.build_id }}
